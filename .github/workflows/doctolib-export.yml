name: Doctolib Termin-Export

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Startdatum (YYYY-MM-DD)'
        required: true
        default: '2025-10-01'
      to:
        description: 'Enddatum (YYYY-MM-DD)'
        required: true
        default: '2025-10-31'

jobs:
  export:
    runs-on: ubuntu-latest

    env:
      DOCTOLIB_EMAIL: ${{ secrets.DOCTOLIB_EMAIL }}
      DOCTOLIB_PASSWORD: ${{ secrets.DOCTOLIB_PASSWORD }}
      DOCTOLIB_ORG_ID: "263702"
      DOCTOLIB_FROM: ${{ github.event.inputs.from }}
      DOCTOLIB_TO: ${{ github.event.inputs.to }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20          # <– cache raus

      - name: Install dependencies
        run: npm ci || npm install   # falls noch kein package-lock da ist

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run export
        run: npm run export

      - name: Upload CSV exports
        uses: actions/upload-artifact@v4
        with:
          name: doctolib-csv
          path: exports/
          if-no-files-found: error
