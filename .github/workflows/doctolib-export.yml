name: Doctolib Export

on:
  schedule:
    - cron: "0 3 * * *"  # täglich um 03:00 UTC
  workflow_dispatch:      # manueller Start möglich

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Doctolib export
        env:
          DOCTOLIB_USER: ${{ secrets.DOCTOLIB_USER }}
          DOCTOLIB_PASS: ${{ secrets.DOCTOLIB_PASS }}
          DOCTOLIB_STATS_URL: ${{ secrets.DOCTOLIB_STATS_URL }}
          # Optionale Feinsteuerung:
          # DATE_FILTERING: "start_date"   # oder "created_at"
          # PRIMARY_GROUP: "agenda"        # Terminkalender
          # SECONDARY_GROUP: ""            # keine zweite Gruppierung
          # EXCLUDE_STATUSES: "deleted"    # z.B. "deleted,no_show"
        run: npm run export

      - name: Upload exports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctolib-exports
          path: exports/
          if-no-files-found: warn
