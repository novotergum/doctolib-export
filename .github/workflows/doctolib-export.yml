jobs:
  export:
    runs-on: ubuntu-latest

    env:
      DOCTOLIB_EMAIL: ${{ secrets.DOCTOLIB_EMAIL }}
      DOCTOLIB_PASSWORD: ${{ secrets.DOCTOLIB_PASSWORD }}
      DOCTOLIB_ORG_ID: "263702"          # oder ebenfalls als Secret
      DOCTOLIB_FROM: "2025-10-01"
      DOCTOLIB_TO: "2025-10-31"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install chromium

      - name: Run export
        run: npm run export
