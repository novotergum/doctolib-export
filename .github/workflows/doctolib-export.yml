name: Doctolib Insights Export

on:
  schedule:
    - cron: "0 3 * * *"  # täglich um 03:00 UTC
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run export
        env:
          INSIGHTS_BASE_URL: "https://dbinsights-production.doctolib.fr"
          INSIGHTS_PATH: ${{ secrets.DOCTOLIB_INSIGHTS_PATH }}
          OUTPUT_NAME: "doctolib_insights.csv"
        run: npm run export

      - name: Upload export as artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctolib-insights
          path: exports/
          if-no-files-found: warn
