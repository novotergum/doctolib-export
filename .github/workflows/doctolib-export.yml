name: Doctolib Termin-Export

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run export
        env:
          DOCTOLIB_USER: ${{ secrets.DOCTOLIB_USER }}
          DOCTOLIB_PASS: ${{ secrets.DOCTOLIB_PASS }}
          DOCTOLIB_ORG_ID: ${{ secrets.DOCTOLIB_ORG_ID }}
          # optional:
          # DATE_FILTERING: "start_date"
          # PRIMARY_GROUP: "agenda"
          # SECONDARY_GROUP: ""
          # EXCLUDE_STATUSES: "deleted"
        run: npm run export

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: doctolib-terminexport
          path: exports/
          if-no-files-found: warn
