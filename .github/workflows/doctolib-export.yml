name: Doctolib Termin-Export

on:
  # Manuell starten über "Run workflow" in GitHub
  workflow_dispatch:
    inputs:
      from:
        description: 'Startdatum (YYYY-MM-DD)'
        required: false
        default: ''
      to:
        description: 'Enddatum (YYYY-MM-DD)'
        required: false
        default: ''

  # Optional: automatischer Lauf (z. B. jeden 2. des Monats für den Vormonat)
  # schedule:
  #   - cron: '0 3 2 * *'  # 03:00 UTC → 04:00/05:00 Deutschland, je nach Sommerzeit

jobs:
  export:
    runs-on: ubuntu-latest

    env:
      DOCTOLIB_EMAIL: ${{ secrets.DOCTOLIB_EMAIL }}
      DOCTOLIB_PASSWORD: ${{ secrets.DOCTOLIB_PASSWORD }}
      DOCTOLIB_ORG_ID: "263702"

      # Falls Inputs leer sind, nimmt das Script automatisch den letzten vollen Monat
      DOCTOLIB_FROM: ${{ github.event.inputs.from }}
      DOCTOLIB_TO: ${{ github.event.inputs.to }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Doctolib export
        run: npm run export

      - name: Upload CSV exports
        uses: actions/upload-artifact@v4
        with:
          name: doctolib-csv
          path: exports/
          if-no-files-found: error
